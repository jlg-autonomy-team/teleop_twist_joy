teleop_twist_joy_node:
  ros__parameters:
    axis_linear:  # Left thumb stick vertical
      x: 1
    scale_linear:
      x: 0.7
    scale_linear_turbo:
      x: 1.5
    scale_linear_slow:
      x: 0.2

    axis_angular:  # Left thumb stick horizontal
      yaw: 3
    scale_angular:
      yaw: 0.4
    scale_angular_turbo:
      yaw: 1.0
    scale_angular_slow:
      yaw: 0.2

    enable_button: 4  # Left trigger button
    enable_turbo_button: 5  # Right trigger button
    enable_slow_axis: 5  # Right trigger axis
